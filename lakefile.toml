name = "Unfoldings"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Unfoldings", "Audit"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Unfoldings"

[[lean_lib]]
name = "Audit"

# Pinned, licensed upstream sources; see vendor/schoenflies/UPSTREAM.md.
[[lean_lib]]
name = "Schoenflies"
srcDir = "vendor/schoenflies"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency.types=false"]
